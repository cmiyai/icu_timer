<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dual Timer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .timer {
      background-color: #fff;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 280px;
    }

    .timer h2 {
      margin-bottom: 0.5rem;
    }

    input[type="number"] {
      width: 60px;
      padding: 0.3rem;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .display {
      font-size: 2rem;
      margin: 1rem 0;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.4rem 1rem;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 0.4rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    .main-control {
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <h1>Dual Timer v1</h1>

  <div class="timer-container">
    <!-- Timer 1 -->
    <div class="timer">
      <h2>Timer 1</h2>
      <label>Minutes: <input type="number" id="minutes1" value="1" min="0"/></label>
      <div id="display1" class="display">03:00</div>
      <div class="controls">
        <button onclick="startTimer(1)">Start</button>
        <button onclick="pauseTimer(1)">Pause</button>
        <button onclick="resumeTimer(1)">Resume</button>
        <button onclick="resetTimer(1)">Reset</button>
      </div>
    </div>

    <!-- Timer 2 -->
    <div class="timer">
      <h2>Timer 2</h2>
      <label>Minutes: <input type="number" id="minutes2" value="2" min="0"/></label>
      <div id="display2" class="display">02:00</div>
      <div class="controls">
        <button onclick="startTimer(2)">Start</button>
        <button onclick="pauseTimer(2)">Pause</button>
        <button onclick="resumeTimer(2)">Resume</button>
        <button onclick="resetTimer(2)">Reset</button>
      </div>
    </div>
  </div>

  <div class="main-control">
    <button onclick="startBothTimers()">Start Both Timers</button>
  </div>

  <script>
    const timers = {
      1: { time: 0, interval: null, isPaused: false, remaining: 0 },
      2: { time: 0, interval: null, isPaused: false, remaining: 0 },
    };

    function formatTime(seconds) {
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function startTimer(id) {
      clearInterval(timers[id].interval);
      const minutes = parseInt(document.getElementById(`minutes${id}`).value) || 0;
      timers[id].time = minutes * 60;
      timers[id].remaining = timers[id].time;
      timers[id].isPaused = false;
      updateDisplay(id);

      timers[id].interval = setInterval(() => {
        if (timers[id].remaining > 0) {
          timers[id].remaining--;
          updateDisplay(id);
        } else {
          clearInterval(timers[id].interval);
        }
      }, 1000);
    }

    function pauseTimer(id) {
      clearInterval(timers[id].interval);
      timers[id].isPaused = true;
    }

    function resumeTimer(id) {
      if (timers[id].isPaused && timers[id].remaining > 0) {
        timers[id].isPaused = false;
        timers[id].interval = setInterval(() => {
          if (timers[id].remaining > 0) {
            timers[id].remaining--;
            updateDisplay(id);
          } else {
            clearInterval(timers[id].interval);
          }
        }, 1000);
      }
    }

    function resetTimer(id) {
      clearInterval(timers[id].interval);
      timers[id].remaining = parseInt(document.getElementById(`minutes${id}`).value || 0) * 60;
      timers[id].isPaused = false;
      updateDisplay(id);
    }

    function updateDisplay(id) {
      document.getElementById(`display${id}`).textContent = formatTime(timers[id].remaining);
    }

    function startBothTimers() {
      startTimer(1);
      startTimer(2);
    }
  </script>

</body>
</html>
