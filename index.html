<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dual Timer</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f4f4f4;
      text-align: center;
      padding: 2rem;
    }

    h1 {
      margin-bottom: 2rem;
    }

    .timer-container {
      display: flex;
      justify-content: center;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .timer {
      background-color: #fff;
      padding: 1.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 280px;
      transition: background-color 0.3s ease;
    }

    .timer.alarm {
      background-color: #ff4d4d;
    }

    .timer h2 {
      margin-bottom: 0.5rem;
    }

    input[type="number"] {
      width: 60px;
      padding: 0.3rem;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .display {
      font-size: 2rem;
      margin: 1rem 0;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    button {
      padding: 0.4rem 1rem;
      font-size: 1rem;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 0.4rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    button:disabled {
      background-color: #aaa;
      cursor: not-allowed;
    }

    .main-control {
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <h1>Dual Timer v1</h1>

  <div class="timer-container">
    <!-- Timer 1 -->
    <div class="timer" id="timerBox1">
      <h2>Timer 1</h2>
      <label>Minutes: <input type="number" id="minutes1" value="3" min="0"/></label>
      <div id="display1" class="display">03:00</div>
      <div class="controls">
        <button onclick="startTimer(1)">Start</button>
        <button onclick="resetTimer(1)">Reset</button>
      </div>
    </div>

    <!-- Timer 2 -->
    <div class="timer" id="timerBox2">
      <h2>Timer 2</h2>
      <label>Minutes: <input type="number" id="minutes2" value="2" min="0"/></label>
      <div id="display2" class="display">02:00</div>
      <div class="controls">
        <button onclick="startTimer(2)">Start</button>
        <button onclick="resetTimer(2)">Reset</button>
      </div>
    </div>
  </div>

  <div class="main-control">
    <button onclick="startBothTimers()">Start Both Timers</button>
  </div>

  <script>
    const timers = {
      1: { interval: null, duration: 0, startTime: null, endTime: null },
      2: { interval: null, duration: 0, startTime: null, endTime: null }
    };

    function formatTime(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const seconds = String(totalSeconds % 60).padStart(2, '0');
      return `${minutes}:${seconds}`;
    }

    function playAlarmSound(duration = 2) {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = ctx.createOscillator();
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(880, ctx.currentTime);
      oscillator.connect(ctx.destination);
      oscillator.start();
      oscillator.stop(ctx.currentTime + duration);
    }

    function updateTimer(id) {
      const now = Date.now();
      const timer = timers[id];
      const remaining = Math.max(0, timer.endTime - now);
      document.getElementById(`display${id}`).textContent = formatTime(remaining);

      if (remaining <= 0) {
        clearInterval(timer.interval);
        document.getElementById(`timerBox${id}`).classList.add("alarm");
        playAlarmSound();
      }
    }

    function startTimer(id) {
      clearInterval(timers[id].interval);
      document.getElementById(`timerBox${id}`).classList.remove("alarm");

      const minutes = parseInt(document.getElementById(`minutes${id}`).value) || 0;
      const duration = minutes * 60 * 1000;
      const now = Date.now();

      timers[id].duration = duration;
      timers[id].startTime = now;
      timers[id].endTime = now + duration;

      updateTimer(id);
      timers[id].interval = setInterval(() => updateTimer(id), 250);
    }

    function resetTimer(id) {
      clearInterval(timers[id].interval);
      document.getElementById(`timerBox${id}`).classList.remove("alarm");

      const minutes = parseInt(document.getElementById(`minutes${id}`).value) || 0;
      const duration = minutes * 60 * 1000;

      timers[id].duration = duration;
      timers[id].startTime = null;
      timers[id].endTime = null;

      document.getElementById(`display${id}`).textContent = formatTime(duration);
    }

    function startBothTimers() {
      startTimer(1);
      startTimer(2);
    }
  </script>

</body>
</html>
